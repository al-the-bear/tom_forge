name: tom_forge_ui_test
description: "Test application for the Tom Forge shell UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  flutter:
    sdk: flutter
  # The test IDE composes the panel shell with its parts: the kit, the shared
  # look, the shell, the terminal, the code editors, the platform keychain and
  # the desktop host.
  tom_forge_kit:
    path: ../tom_forge_kit
  tom_forge_shared_ui:
    path: ../tom_forge_shared_ui
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
  tom_forge_core:
    path: ../tom_forge_core
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_md_editor:
    path: ../tom_md_editor
  tom_dart_editor:
    path: ../tom_dart_editor
  tom_yaml_editor:
    path: ../tom_yaml_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
