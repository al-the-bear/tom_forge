name: tom_forge_app
description: "Tom Forge IDE - Production application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  flutter:
    sdk: flutter
  # What Tom Forge composes: the kit, the shared look, the panel shell (its
  # shells, scaffold, applications and the built-in views of the app module)
  # and the shell parts it hands every shell (the terminal, the code editor
  # adapters, the platform keychain, the desktop host).
  tom_forge_kit:
    path: ../tom_forge_kit
  tom_forge_shared_ui:
    path: ../tom_forge_shared_ui
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_md_editor:
    path: ../tom_forge_md_editor
  tom_forge_dart_editor:
    path: ../tom_forge_dart_editor
  tom_forge_yaml_editor:
    path: ../tom_forge_yaml_editor
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
  # StandardEditingActions: the Edit menu dispatches undo/redo by the same
  # action ids the keystroke uses.
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  tom_website_editor:
    path: ../tom_website_editor
  # The file editors: Markdown, YAML, todo files, .env and text, each over a
  # ForgeFileSession.
  tom_forge_file_editors:
    path: ../tom_forge_file_editors
  # The quest applications: one per open quest, the picker, the frame.
  tom_forge_quests:
    path: ../tom_forge_quests
  # The office editors: LibreOfficeKit (the default for the office kinds)
  # and ZetaOffice.
  tom_forge_office_editors:
    path: ../tom_forge_office_editors
  # Its debug trail switches, which the command line's --trail=office sets.
  tom_office_editor:
    path: ../../tom_ai/modules/tom_office_editor
  # The PDF editors: PDFium (the default for .pdf) and pdf.js.
  tom_forge_pdf_editors:
    path: ../tom_forge_pdf_editors
  # Its debug trail switch, which the command line's --trail=pdf sets.
  tom_pdf_editor:
    path: ../../tom_ai/modules/tom_pdf_editor
  dart_style: ^3.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The preferences' mock store (forge_launch_test FL-2).
  shared_preferences: ^2.2.0
  # The undo conformance harness and the shell test doubles.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # The file editors' undo subjects (qim_none5_file_editors_test).
  tom_forge_file_editors_testing:
    path: ../tom_forge_file_editors_testing
  flutter_lints: ^6.0.0
  # Joining the paths the licence audit test reads and writes.
  path: ^1.9.0
  # The licence audit of the packages this app resolves (licence_audit.dart).
  tom_test_support:
    path: ../../tom_ai/basics/tom_test_support

flutter:
  uses-material-design: true
  # The Dart editor's summary pair, built by tom_dart_editor_bundler in
  # tom_dart_editor_test and copied here (asset directory entries are not
  # recursive, so the scope's folder is listed).
  assets:
    - assets/summaries/
    - assets/summaries/dart-editor/
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
