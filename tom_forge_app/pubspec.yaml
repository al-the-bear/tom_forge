name: tom_forge_app
description: "Tom Forge IDE - Production application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  flutter:
    sdk: flutter
  tom_forge_ui:
    path: ../tom_forge_ui
  # StandardEditingActions: the Edit menu dispatches undo/redo by the same
  # action ids the keystroke uses.
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  tom_website_editor:
    path: ../tom_website_editor
  # The file editors: Markdown, YAML, todo files, .env and text, each over a
  # ForgeFileSession.
  tom_forge_file_editors:
    path: ../tom_forge_file_editors
  # The quest applications: one per open quest, the picker, the frame.
  tom_forge_quests:
    path: ../tom_forge_quests
  # The PDF editors: PDFium (the default for .pdf) and pdf.js.
  tom_forge_pdf_editors:
    path: ../tom_forge_pdf_editors
  # Its debug trail switch, which the command line's --trail=pdf sets.
  tom_pdf_editor:
    path: ../../tom_ai/modules/tom_pdf_editor
  dart_style: ^3.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The undo conformance harness and the shell test doubles.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  flutter_lints: ^6.0.0
  # Joining the paths the licence audit test reads and writes.
  path: ^1.9.0
  # The licence audit of the packages this app resolves (licence_audit.dart).
  tom_test_support:
    path: ../../tom_ai/basics/tom_test_support

flutter:
  uses-material-design: true
  # The Dart editor's summary pair, built by tom_dart_editor_bundler in
  # tom_dart_editor_test and copied here (asset directory entries are not
  # recursive, so the scope's folder is listed).
  assets:
    - assets/summaries/
    - assets/summaries/dart-editor/
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
